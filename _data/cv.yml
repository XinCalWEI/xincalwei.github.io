# CV data: the single source for /cv/ (rendered by _layouts/cv.liquid).
#
# Sections render in this order (the order a search committee reads a CV).
#   type: map | list | time_table | nested_list   content lives here
#   type: publications | teaching | mentoring     generated from papers.bib,
#         _data/teaching.yml and the People page front matter, so the CV
#         never drifts from those pages; `link` points at the full page
#   placement: header                              rendered compactly in the
#         page header instead of as a section
#   style: cards (map only)                        a grid of contact cards
# time_table rows: year (shown in the left column), title, institution,
# description (bullets) or items (rows without a title).

