{%- comment -%}
  Hero contour motif, inlined (not a CSS mask) so the browser never treats this
  decoration as the page's Largest Contentful Paint image: the LCP stays the
  statement text or the portrait. Same terrain as assets/img/brand/contours.svg,
  cropped to the part the hero shows (x >= 40% of the field), simplified at
  tol 1.3. Strokes take currentColor; colour, opacity and the left fade are set
  by .home-hero__contours in _sass/pages/_home.scss.
  Regenerate after changing _scripts/make-contours.py (numpy + scikit-image):
    import importlib.util, numpy as np; from skimage.measure import find_contours
    spec = importlib.util.spec_from_file_location("mc", "_scripts/make-contours.py")
    mc = importlib.util.module_from_spec(spec); spec.loader.exec_module(mc)
    z = mc.terrain(); h, w = z.shape; sx, sy = 1600 / (w - 1), 600 / (h - 1)
    c0 = round(0.4 * (w - 1)); levels = np.linspace(z.min(), z.max(), 18)[1:-1]
    for i, lev in enumerate(levels):        # every 5th level is an index contour
        for c in find_contours(z[:, c0:], lev):
            if len(c) >= 8: c[:, 1] += c0; d = mc.to_path(c, sx, sy, 1.3, min_len=60)
    viewBox = f"{c0 * sx:.1f} 0 {1600 - c0 * sx:.1f} 600"
{%- endcomment -%}
