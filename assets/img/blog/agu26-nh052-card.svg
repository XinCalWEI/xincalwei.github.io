    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1320 180) rotate(132) scale(620 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39c6b3" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#39c6b3" stop-opacity="0"/>
