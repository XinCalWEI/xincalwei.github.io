<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AGU 2026 session NH052 call for abstracts</title>
  <desc id="desc">A navy editorial cover highlighting the session on reliable and scalable geohazard intelligence.</desc>
  <defs>
