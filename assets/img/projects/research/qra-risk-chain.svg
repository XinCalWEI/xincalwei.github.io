<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Risk chain from uncertain slope strength to impact probability and consequence</title>
  <desc id="desc">Lognormal cohesion and friction angle samples enter a coupled Eulerian-Lagrangian simulation, which produces failure and runout behavior. Realizations are tested against a reach threshold, translated into vulnerability, and combined with exposure and value to calculate risk.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5Z" fill="#65747a"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#f7f6f2"/>

  <g fill="none" stroke="#d6dcda" stroke-width="2">
    <rect x="36" y="76" width="192" height="350" rx="10"/>
    <rect x="270" y="76" width="210" height="350" rx="10"/>
    <rect x="522" y="76" width="190" height="350" rx="10"/>
    <rect x="754" y="76" width="190" height="350" rx="10"/>
    <rect x="986" y="76" width="178" height="350" rx="10"/>
  </g>

  <g fill="none" stroke="#65747a" stroke-width="3" marker-end="url(#arrow)">
    <path d="M228 251h36"/>
    <path d="M480 251h36"/>
    <path d="M712 251h36"/>
    <path d="M944 251h36"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#263238">
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="132" y="108">PARAMETRIC</text><text x="132" y="132">UNCERTAINTY</text>
      <text x="375" y="108">CEL LARGE-DEFORMATION</text><text x="375" y="132">SIMULATION</text>
      <text x="617" y="108">REACH / IMPACT</text><text x="617" y="132">EVENT</text>
      <text x="849" y="108">CONSEQUENCE</text><text x="849" y="132">MODEL</text>
      <text x="1075" y="108">RISK</text>
    </g>

    <g font-size="20" text-anchor="middle">
      <text x="132" y="194" font-style="italic">c, φ</text>
      <text x="132" y="220">lognormal samples</text>
      <text x="132" y="374" font-size="16" fill="#65747a">geometry and interventions</text>
      <text x="132" y="396" font-size="16" fill="#65747a">set by scenarios</text>

      <text x="375" y="350" font-size="17">failure · runout · deposition</text>
      <text x="617" y="208" font-style="italic">F = {L &gt; b}</text>
      <text x="617" y="354" font-size="16" fill="#65747a">subset simulation targets</text>
      <text x="617" y="376" font-size="16" fill="#65747a">the threshold region</text>

      <text x="849" y="190" font-size="17">L · Vel · Vol · Δh</text>
      <text x="849" y="216" font-size="17">or wave height</text>
      <text x="849" y="364" font-size="16" fill="#65747a">empirical vulnerability</text>
      <text x="849" y="386" font-size="16" fill="#65747a">V ∈ [0, 1]</text>

      <text x="1075" y="216" font-size="22" font-style="italic">P<tspan baseline-shift="sub" font-size="15">fr</tspan> P<tspan baseline-shift="sub" font-size="15">t</tspan> V̄ E</text>
      <text x="1075" y="278" font-size="17">impact probability</text>
      <text x="1075" y="302" font-size="17">× exposure</text>
      <text x="1075" y="326" font-size="17">× conditional loss</text>
    </g>
  </g>

  <g transform="translate(67 248)" fill="none" stroke-linecap="round">
    <path d="M0 72c14-48 34-69 57-69s43 21 57 69" stroke="#3b6fb6" stroke-width="3"/>
    <path d="M26 72c10-30 23-43 38-43s28 13 38 43" stroke="#c75d45" stroke-width="3"/>
    <path d="M57 0v80M64 27v53" stroke="#a8b2b4" stroke-width="1.5" stroke-dasharray="5 5"/>
  </g>

  <g transform="translate(294 165)" stroke="#263238" stroke-linejoin="round">
    <path d="M0 145h165L102 18Z" fill="#e8ecea" stroke-width="2.5"/>
    <path d="M27 128c47-19 75-55 94-105" fill="none" stroke="#c75d45" stroke-width="4"/>
    <path d="M115 45c21 31 40 60 67 83" fill="none" stroke="#3b6fb6" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M165 145h24" fill="none" stroke-width="2.5"/>
  </g>

  <g transform="translate(544 162)" fill="none" stroke-linecap="round">
    <path d="M0 170h148" stroke="#263238" stroke-width="2"/>
    <path d="M12 151c48-9 77-41 103-98" stroke="#98a4a8" stroke-width="2.5"/>
    <path d="M12 160c62-7 104-38 136-96" stroke="#c75d45" stroke-width="4"/>
    <path d="M103 23v166" stroke="#65747a" stroke-width="2" stroke-dasharray="8 7"/>
    <rect x="129" y="122" width="28" height="48" fill="#f1ddd7" stroke="#263238" stroke-width="2"/>
    <text x="92" y="15" fill="#65747a" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="15">b</text>
  </g>

  <g transform="translate(784 249)">
    <rect width="130" height="18" rx="9" fill="#dce9f5"/>
    <rect width="96" height="18" rx="9" fill="#f3e4c8"/>
    <rect width="58" height="18" rx="9" fill="#f1ddd7"/>
    <circle cx="96" cy="9" r="7" fill="#c75d45"/>
    <text x="0" y="48" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#65747a">0</text>
    <text x="122" y="48" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#65747a">1</text>
  </g>

  <text x="600" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#65747a">Conceptual synthesis of the paper's SS–CEL workflow; not plotted data.</text>
</svg>
